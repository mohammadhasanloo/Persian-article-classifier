[project]
name = "persian-article-classifier"
version = "1.0.0"
description = "Multinomial naive Bayes classifier for Persian magazine articles"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
persian = ["hazm>=0.10"]
figures = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[project.scripts]
persian-article-classifier = "naive_bayes.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["naive_bayes*"]
